<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mytreelincs | شجرة الروابط</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .linktree-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 420px;
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .profile-img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 3px solid #38bdf8;
            margin-bottom: 15px;
            object-fit: cover;
        }
        .title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #f8fafc;
        }
        .bio {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 25px;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .link-btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }
        .link-btn:hover {
            background: #38bdf8;
            color: #0f172a;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4);
        }
        .footer {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="linktree-card">
    <img src="https://via.placeholder.com/100" alt="Profile" class="profile-img">
    <h1 class="title">Mytreelincs</h1>
    <p class="bio">صفحتي الشخصية للروابط</p>

    <div class="links-container">
        <a href="https://github.com" target="_blank" class="link-btn">حسابي على GitHub</a>
        <a href="https://huggingface.co" target="_blank" class="link-btn">مشاريعي على Hugging Face</a>
        <a href="#" class="link-btn">الموقع الشخصي</a>
        <a href="#" class="link-btn">تواصل معي</a>
    </div>

    <div class="footer">
        Powered by Firebase & GitHub Pages
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDA3zAKOlWPvh8dv8OP57HMSh_yLCvntE8",
    authDomain: "mytreelincs.firebaseapp.com",
    projectId: "mytreelincs",
    storageBucket: "mytreelincs.firebasestorage.app",
    messagingSenderId: "414449525707",
    appId: "1:414449525707:web:9b7979909fd67d9d57cc4e",
    measurementId: "G-77BVJQ3BFH"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
</script>

</body>
</html>
